[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artax-network"
version = "0.1.0"
description = "Event-driven runtime for embodied AI"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Artax Contributors"}]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/artax-network/artax-network"
Documentation = "https://artax-network.readthedocs.io"
Repository = "https://github.com/artax-network/artax-network"
Issues = "https://github.com/artax-network/artax-network/issues"
Changelog = "https://github.com/artax-network/artax-network/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "black",
    "pre-commit",
    "httpx",
]
chromium = []
dashboard = []

[project.scripts]
artax = "artax.runtime:cli"

[tool.setuptools.packages.find]
include = ["artax*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["all"]
ignore = ["D100", "D104", "S101", "ANN101", "ANN102", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=artax --cov-report=term-missing"

[tool.coverage.run]
source = ["artax"]
omit = ["tests/*", "dashboard/*", "docs/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0
