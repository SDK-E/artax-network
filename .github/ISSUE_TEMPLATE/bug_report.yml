name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered list of steps to reproduce the behavior
      placeholder: |
        1. Install artax
        2. Run command '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux
        - macOS
        - Windows
  - type: textarea
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
  - type: textarea
    id: artax-version
    attributes:
      label: Artax version
      placeholder: "0.1.0"
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other information that might be relevant
