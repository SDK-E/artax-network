name: Architecture Proposal
description: Propose a major architectural change
labels: [architecture]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief summary of the proposed architectural change
      placeholder: One-paragraph summary
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this change needed?
  - type: textarea
    id: detailed-design
    attributes:
      label: Detailed design
      description: How should this be implemented? Include diagrams, code sketches, or pseudocode as needed.
  - type: textarea
    id: trade-offs
    attributes:
      label: Trade-offs
      description: What are the costs, risks, and trade-offs of this approach?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other approaches were considered and why were they rejected?
